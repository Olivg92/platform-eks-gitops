# Local checks, mirrored in CI. Run manually with: pre-commit run -a
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^gitops/.*/templates/  # Helm templates are not plain YAML

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.1
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args: [--hook-config=--retry-once-with-cleanup=true]
      - id: terraform_tflint
        args: [--args=--config=__GIT_WORKING_DIR__/.tflint.hcl]
      - id: terraform_checkov
        args: [--args=--quiet, --args=--compact]

  - repo: local
    hooks:
      # kubeconform needs the Kubernetes schemas, so it runs from the local install
      # (see `make check-tools`) rather than from a pinned hook repository.
      - id: kubeconform
        name: kubeconform
        entry: kubeconform -strict -summary -ignore-missing-schemas
        language: system
        files: ^gitops/.*\.ya?ml$
        exclude: (values|kustomization)\.ya?ml$
