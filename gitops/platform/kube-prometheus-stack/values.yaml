# Sized for a laptop and for a demo cluster that is destroyed every evening:
# no persistence, short retention, one replica of everything.

prometheus:
  prometheusSpec:
    retention: 24h
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
    # Watch every ServiceMonitor, PodMonitor and PrometheusRule in the cluster,
    # not only the ones labelled by this release. SLO rules are generated by
    # Sloth in its own namespace, and applications ship their own ServiceMonitor.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 20m
        memory: 64Mi

grafana:
  # The password is generated in the secret store and delivered by External
  # Secrets Operator: it exists nowhere in this repository. See make grafana-password.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  sidecar:
    dashboards:
      # Applications ship their dashboard as a ConfigMap in their own namespace,
      # labelled grafana_dashboard=1. Without this, only the monitoring namespace
      # would be watched and every team would have to ask the platform to host it.
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  grafana.ini:
    server:
      root_url: https://grafana.platform.local:8443/
    auth.anonymous:
      enabled: false

# Managed control planes (k3s locally, EKS on AWS) do not expose these
# components, so scraping them would only produce permanently firing alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
