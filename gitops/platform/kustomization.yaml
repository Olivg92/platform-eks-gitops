apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Components shared by every environment. Install order comes from sync waves,
# not from this list. Environment-specific applications live in gitops/envs/<env>.
resources:
  - envoy-gateway/application.yaml
  - cert-manager/application.yaml
  - external-secrets/application.yaml
  - secrets/application.yaml
  - kube-prometheus-stack/application.yaml
  - sloth/application.yaml
