# Envoy Gateway runs a single control-plane replica: enough for a demo cluster.
deployment:
  replicas: 1
  envoyGateway:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

# The proxy image Envoy Gateway deploys by default. Envoy Gateway 1.9.3 deploys
# Envoy v1.39.5 by default, whose distroless image still ships a ca-certificates
# package that trusts the roots the compromised eMudhra intermediate CAs chain to;
# v1.39.6 is the same Envoy code, rebuilt on the patched package
# (20250419+deb13u1). Tag and digest, the form of the default it replaces.
#
# This is a default only: an EnvoyProxy attached without a mergeType replaces it,
# and its Gateway falls back to v1.39.5. Hence the same image in the AWS EnvoyProxy,
# gitops/envs/aws/gateway/envoyproxy.yaml. Remove both once Envoy Gateway's default
# proxy is v1.39.6 or later (Envoy Gateway 1.10.0 deploys v1.40.2).
global:
  images:
    envoyProxy:
      image: docker.io/envoyproxy/envoy:distroless-v1.39.6@sha256:1cac8b3a2f72d5a0918f54d7b49e68aae0b0ba325c2d50c8a9a3fff7a4d1f994
