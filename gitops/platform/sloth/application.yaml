# Wave 0: generates Prometheus recording and alerting rules from SLO objects.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sloth
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://slok.github.io/sloth
      chart: sloth
      targetRevision: 0.16.0
      helm:
        valueFiles:
          - $values/gitops/platform/sloth/values.yaml
    - repoURL: https://github.com/Olivg92/platform-eks-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
