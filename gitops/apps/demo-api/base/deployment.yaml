apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: demo
  labels:
    app.kubernetes.io/name: demo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-api
    spec:
      # The application never calls the Kubernetes API, so it gets no token.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # Same high UID as the image, declared here so the manifest is explicit
        # and cannot silently run as whatever the image decides later.
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-api
          # Overridden per environment: a locally built image on k3d, the
          # image published by CI on AWS.
          image: demo-api:dev
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              value: dev
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
