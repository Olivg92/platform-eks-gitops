# Attaches the application to the shared gateway, on its own hostname. The same
# in both environments: what sits in front of the gateway is what differs.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: demo-api
  namespace: demo
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - demo.platform.local
  rules:
    - backendRefs:
        - name: demo-api
          port: 80
