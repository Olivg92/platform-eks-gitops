# Same name as the local store, "platform", so the ExternalSecrets shipped by the
# applications are identical in both environments. Only what is behind it changes.
#
# No credentials here either: EKS Pod Identity hands short-lived keys to the
# operator's ServiceAccount, the way Vault trusts that same ServiceAccount locally.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-north-1
