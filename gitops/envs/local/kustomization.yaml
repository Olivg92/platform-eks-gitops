apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Local environment: the shared platform components, plus what only exists here
# (Vault in dev mode, a self-signed certificate authority, the TLS overlay).
resources:
  - ../../platform
  - applications/vault-dev.yaml
  - applications/gateway.yaml
  - applications/secret-store.yaml
  - applications/monitoring-route.yaml
  - applications/demo-api.yaml
