# Configures the dev Vault the way a real Vault would be configured by an
# administrator: enable Kubernetes authentication, grant a narrow policy to
# External Secrets Operator, and seed one demo secret.
#
# Run as an Argo CD sync hook so it re-runs on every sync and is replaced
# instead of conflicting with the previous (immutable) Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-configure
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: configure
          image: hashicorp/vault:1.21
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc:8200
            - name: VAULT_TOKEN
              value: root
          command:
            - /bin/sh
            - -ec
            - |
              until vault status >/dev/null 2>&1; do
                echo "waiting for vault..."; sleep 3
              done

              # Workload identity instead of a shared token: Vault trusts the
              # ServiceAccount of External Secrets Operator. Same idea as EKS
              # Pod Identity on AWS.
              vault auth enable kubernetes 2>/dev/null || true
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc"

              vault policy write external-secrets - <<'POLICY'
              path "secret/data/*" {
                capabilities = ["read"]
              }
              path "secret/metadata/*" {
                capabilities = ["read", "list"]
              }
              POLICY

              vault write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=external-secrets \
                ttl=1h

              # A demo secret, so the whole chain can be verified end to end.
              vault kv put secret/demo message="stored in Vault, never in git"

              echo "vault configured"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
