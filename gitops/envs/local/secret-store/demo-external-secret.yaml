# Proof that the chain works: this manifest names a secret without containing it.
# External Secrets Operator reads Vault and creates the Kubernetes Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-credentials
  namespace: demo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: demo-credentials
  data:
    - secretKey: message
      remoteRef:
        key: demo
        property: message
