# Where secrets live in this environment. The name is deliberately neutral:
# the AWS environment declares a store called "platform" too, backed by
# Secrets Manager, so ExternalSecrets never change between environments. and how to authenticate.
# No credential here: authentication uses the operator's own ServiceAccount.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: platform
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
