# External Secrets Operator mints a short-lived token for its own ServiceAccount
# to authenticate against Vault, which requires this permission explicitly.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-token-creator
  namespace: external-secrets
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["external-secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-token-creator
  namespace: external-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-token-creator
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
