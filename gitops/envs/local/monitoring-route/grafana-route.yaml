# First route on the platform: Grafana, reachable through the shared Gateway.
# The certificate comes from the gateway listener, so nothing TLS-related here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - grafana.platform.local
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-grafana
          port: 80
