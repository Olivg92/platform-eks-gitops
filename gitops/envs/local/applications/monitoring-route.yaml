# Wave 1: routes, once the workloads they point at are running.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-route
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Olivg92/platform-eks-gitops.git
    targetRevision: main
    path: gitops/envs/local/monitoring-route
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
