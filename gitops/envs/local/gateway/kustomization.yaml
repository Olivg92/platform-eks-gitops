apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../platform/gateway/base

patches:
  # Locally, certificates are signed by our own CA (see ../issuer).
  # On AWS this annotation will point at a Let's Encrypt issuer instead.
  - target:
      kind: Gateway
      name: platform
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          cert-manager.io/cluster-issuer: platform-ca
      - op: add
        path: /spec/listeners/-
        value:
          name: https
          protocol: HTTPS
          port: 443
          hostname: "*.platform.local"
          tls:
            mode: Terminate
            certificateRefs:
              - name: platform-tls
          allowedRoutes:
            namespaces:
              from: All
