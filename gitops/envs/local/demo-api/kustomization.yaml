apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
resources:
  - ../../../apps/demo-api/base
  - httproute.yaml

images:
  # Built locally and imported into k3d by `make demo-image`. The AWS overlay
  # will point at the image published by CI instead.
  - name: demo-api
    newTag: dev

patches:
  - target:
      kind: Deployment
      name: demo-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
