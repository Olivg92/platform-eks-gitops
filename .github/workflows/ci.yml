name: ci

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the previous run: no point spending
# minutes on a commit nobody will look at.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit rather than by tag. A tag can be moved to point
# at different code; a commit cannot. Dependabot raises the pull requests that
# bump them, so pinning does not mean going stale.
permissions:
  contents: read

jobs:
  checks:
    name: lint and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: the secrets scan below reads all of it on main,
          # and needs the commit a pull request starts from.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          # The wrapper rewrites stdout, which confuses the pre-commit hooks.
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0

      - name: Install the tools the hooks call
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
          pip install --no-cache-dir checkov==3.3.19 pre-commit==4.6.2

      # The plugin comes from the GitHub API, which allows 60 anonymous calls
      # an hour per address; shared runners exhaust that routinely.
      - name: Install the tflint AWS ruleset
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The same hooks as on a developer machine, from the same file. A check
      # that only runs in CI is a check nobody can reproduce before pushing.
      - name: Run every pre-commit hook
        run: pre-commit run --all-files --show-diff-on-failure --color always

      # The gitleaks hook reads what is staged, which is right before a commit
      # and empty on a CI checkout: there it passes whatever the branch holds.
      # This step reads the commits instead, those of the pull request or the
      # whole history of main, so a secret added then deleted is still caught.
      # The same gitleaks as the hook, checked against the checksum of its
      # release. Why the binary and not gitleaks-action: docs/adr/0013.
      - name: Scan the commits for secrets
        env:
          GITLEAKS_VERSION: 8.30.0
          GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            # From the base to the head: when a newer push cancels this run,
            # the next one reads every commit the pull request then holds.
            # Only a commit that a force push dropped meanwhile goes unscanned.
            range="$PR_BASE..$PR_HEAD"
          else
            # On main, everything the pushed commit reaches, not just what the
            # push brought. Merges in quick succession cancel each other's
            # runs (see concurrency above; even without cancel-in-progress,
            # GitHub keeps only the latest pending run by default), so a scan
            # per push leaves the commits of the cancelled runs unscanned.
            # This way, any run that passes vouches for the whole branch, in
            # under a second at this size.
            range="$GITHUB_SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --no-banner --log-opts="$range"

  tests:
    name: demo-api tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same Python as the runtime image, since that is what the code
      # actually runs on.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: apps/demo-api/requirements-dev.txt

      - run: pip install --no-cache-dir -r requirements-dev.txt

      - run: pytest -q

  manifests:
    name: manifests render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kustomize and kubeconform
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.1/kustomize_v5.8.1_linux_amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kustomize
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform

      # kubeconform in pre-commit validates the files as written; this validates
      # what they produce once bases and patches are combined, which is what
      # Argo CD actually sends to the API server.
      #
      # Every kustomization is rendered, not just the environment roots: those
      # only list Argo CD Applications, while the patches that can break (the
      # gateway TLS listener, the demo API overlay) live one level down.
      - name: Render every kustomization
        run: scripts/render-manifests.sh
