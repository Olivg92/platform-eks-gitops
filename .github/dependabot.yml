version: 2

# Pinning by commit only works if something bumps the pins. That something is
# this file: one pull request per update, reviewed like any other change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /apps/demo-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: /apps/demo-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/demo
      - /terraform/modules/eks
      - /terraform/modules/vpc
      - /terraform/modules/workload-identity
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
