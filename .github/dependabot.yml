version: 2

# Pinning by commit only works if something bumps the pins. That something is
# this file: one pull request per update, reviewed like any other change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /apps/demo-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: /apps/demo-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # The build and runtime stages must share a Python version, since compiled
    # dependencies are built for one interpreter. No group is needed for that:
    # both stages use chainguard/python, one dependency to Dependabot, so both
    # digests move in the same pull request (#17 did). Its handling of this
    # registry's `latest` digests is not reliable on its own; see docs/adr/0011.

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/demo
      - /terraform/modules/eks
      - /terraform/modules/vpc
      - /terraform/modules/workload-identity
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # A provider bump is one change, however many roots it touches. Grouped by
    # dependency name, it comes as one pull request for all five directories
    # instead of one per directory: a single hashicorp/aws release opened five
    # (#37 to #41), the default limit, and Terraform updates stopped there.
    # The group sets no pattern, so every dependency falls in it. The group #19
    # removed never matched because its pattern was not the name Dependabot
    # gives the image; with no pattern, there is no name to get wrong.
    groups:
      terraform-providers:
        group-by: dependency-name
