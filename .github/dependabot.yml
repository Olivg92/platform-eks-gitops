version: 2

# Pinning by commit only works if something bumps the pins. That something is
# this file: one pull request per update, reviewed like any other change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /apps/demo-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: /apps/demo-api
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
    # The build and runtime stages must share a Python version, since compiled
    # dependencies are built for one interpreter. Grouped, they move in a single
    # pull request; separately, main could run a runtime newer than its build.
    # Dependabot's handling of this registry's `latest` digests is not reliable
    # on its own; see the update at the end of docs/adr/0011.
    groups:
      chainguard-python:
        patterns:
          - "cgr.dev/chainguard/python*"

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/demo
      - /terraform/modules/eks
      - /terraform/modules/vpc
      - /terraform/modules/workload-identity
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore"
